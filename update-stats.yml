name: Update GitHub Stats Widget

on:
  schedule:
    # Runs once a day at 03:00 UTC. Adjust as you like (cron syntax).
    - cron: "0 3 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate stats card
        env:
          GH_USERNAME: niRmana11
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: node scripts/generate-stats.js

      - name: Commit updated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add generated/stats-card.svg
          git diff --quiet --cached || git commit -m "chore: update stats card [skip ci]"
          git push
